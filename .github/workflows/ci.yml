name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "packages/core[dev]"
      - run: python -m pytest packages/core/tests -q
      - run: ruff check packages/core/src packages/core/tests
      - run: ruff format --check packages/core/src packages/core/tests
      - run: mypy --config-file packages/core/pyproject.toml --cache-dir .mypy_cache packages/core/src/ai_dev_team
      - run: python -m pip check

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build packages/core
      - run: python -m twine check packages/core/dist/*
      - run: python -m pip install --no-deps --force-reinstall packages/core/dist/*.whl
      - run: python -I -c "import ai_dev_team; print(ai_dev_team.__version__)"

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            packages/server/package-lock.json
            packages/cli/package-lock.json
      - run: npm ci --prefix packages/server
      - run: npm ci --prefix packages/cli
      - run: npm test --prefix packages/server
      - run: npm run typecheck --prefix packages/cli
      - run: npm test --prefix packages/cli

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --file packages/server/Dockerfile --tag ai-dev-team-server:ci .
