services:
  api:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      AGENT_WORKSPACE: /workspace
      PYTHON_EXECUTABLE: /app/.venv/bin/python
    volumes:
      - app-data:/app/data
      - agent-workspace:/workspace
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  app-data:
  agent-workspace:
